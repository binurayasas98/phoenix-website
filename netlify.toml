[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build files never change, so browsers can keep them for a year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects from the old website (301)
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/About"
  to = "/about"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301

[[redirects]]
  from = "/Services"
  to = "/services"
  status = 301

[[redirects]]
  from = "/Projects"
  to = "/projects"
  status = 301

[[redirects]]
  from = "/project/*"
  to = "/projects"
  status = 301

[[redirects]]
  from = "/Contact"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/contact"
  status = 301
